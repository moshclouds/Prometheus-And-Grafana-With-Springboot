global:
  scrape_interval: 15s
  evaluation_interval: "15s"

scrape_configs:
  - job_name: 'inventory-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8900']
        labels:
          application: 'Inventory Service Application'

  - job_name: 'order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8100']
        labels:
          application: 'Order Service Application'

  - job_name: 'cart-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8300']
        labels:
          application: 'Cart Service Application'

  - job_name: 'api-gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8099']
        labels:
          application: 'Gateway Service Application'